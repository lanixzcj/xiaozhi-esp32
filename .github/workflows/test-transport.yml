name: Lichuang transport development
on:
  push:
    branches: [feat/lichuang-transport-theme]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lichuang:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v7
      - name: Host regression tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Build Lichuang ESP32-S3 development firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev
